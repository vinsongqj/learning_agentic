[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vgoh", email = "vinsonquanjun@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "openai>=3.44.0",
    "python-dotenv>=1.2.4",
    "wikipedia>=1.4.0",
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
